name: mesa

# Mesa's OSMesa with panfrost (Midgard v5, the J7 Prime's Mali-T830) and softpipe for iOS arm64
# (tools/mesa/mk-mesa-ios.sh), and the programs that use it (tools/gl_test, tools/mali_test, which
# runs gl_test). Output: artifact "gpu-userland", for the kernel's file installer (xnu 0194, on7put).

on:
  # workflow_dispatch needs the file on the default branch; a push of the sources runs it on any branch
  push:
    paths:
      - tools/mesa/**
      - tools/gl_test/**
      - tools/eagl/**
      - .github/workflows/mesa.yml
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub runner label (macos-15-intel when arm64 runners are out of capacity)
        default: macos-15

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install bison flex ninja
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Mesa
        run: |
          set -eux
          bison --version | head -1
          WORK=$RUNNER_TEMP/mesa SYMS=$RUNNER_TEMP/syms bash tools/mesa/mk-mesa-ios.sh out/lib

      - name: Programs
        run: |
          set -eux
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="$(xcrun --sdk iphoneos --find clang) -isysroot $SDK -arch arm64 -miphoneos-version-min=16.0"
          mkdir -p out/bin
          $CC -O2 -Wall -Werror -o out/bin/gl_test tools/gl_test/gl_test.c \
            out/lib/*.dylib
          # the phone's dyld refuses @rpath here ("security policy does not allow @ path expansion",
          # xnu91 boot): the library by its path on the phone, beside gl_test (on7put makes no directories)
          install_name_tool -change @rpath/libOSMesa.8.dylib /usr/local/bin/libOSMesa.8.dylib out/bin/gl_test
          $CC -O2 -Wall -Werror -framework IOKit -o out/bin/mali_test tools/mali_test/mali_test.c
          # libon7gl.dylib (tools/eagl): EAGLContext on Mesa inside backboardd (xnu 0196, boot-arg on7gl=1)
          M=$RUNNER_TEMP/mesa/mesa-25.0.7
          nm -gU out/lib/libOSMesa.8.dylib | awk '$3 ~ /^_gl/ { print substr($3, 2) }' > $RUNNER_TEMP/exported-gl.txt
          wc -l $RUNNER_TEMP/exported-gl.txt
          python3 tools/eagl/mkeagl.py tools/eagl/eagl_slots.txt $M/src/mapi/glapi/registry/gl.xml \
            $RUNNER_TEMP/exported-gl.txt tools/eagl/eagl.c > $RUNNER_TEMP/eagl_gen.h
          $CC -O2 -dynamiclib -install_name /usr/local/bin/libon7gl.dylib -I$RUNNER_TEMP -Itools/eagl \
            -framework CoreFoundation -framework IOKit -framework IOSurface -lobjc out/lib/libOSMesa.8.dylib \
            -o out/bin/libon7gl.dylib tools/eagl/eagl.c tools/eagl/gl_osmesa.c tools/eagl/surface_checksum.c
          install_name_tool -change @rpath/libOSMesa.8.dylib /usr/local/bin/libOSMesa.8.dylib out/bin/libon7gl.dylib
          otool -L out/bin/libon7gl.dylib
          for f in out/bin/*; do codesign -f -s - --entitlements tools/on7wifid/on7wifid-ents.plist $f; done
          otool -L out/bin/gl_test
          ls -l out/bin out/lib
          shasum -a 256 out/bin/* out/lib/*

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-userland
          path: out

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-symbols
          path: ${{ runner.temp }}/syms
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mesa-logs
          path: |
            ${{ runner.temp }}/mesa/build/meson-logs
          retention-days: 7
